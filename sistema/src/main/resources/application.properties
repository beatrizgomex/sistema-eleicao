spring.application.name=eleicao
spring.profiles.active=dev

spring.datasource.url=jdbc:mysql://localhost:3306/eleicao?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:chave-de-desenvolvimento-com-no-minimo-32-caracteres}
jwt.expiracao-minutos=60